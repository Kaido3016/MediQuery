name: one-time-formatting-helper

on:
  push:
    branches:
      - fix/security-data-lifecycle-quality-gates

permissions:
  contents: write

concurrency:
  group: temporary-formatting-helper
  cancel-in-progress: true

jobs:
  format-and-commit-on-task-branch:
    if: github.ref == 'refs/heads/fix/security-data-lifecycle-quality-gates'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -r requirements-ci.txt
      - name: Apply Black formatting to the task branch
        run: python -m black src tests app.py evaluation ops
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.8"
      - name: Format Terraform
        run: terraform fmt -recursive infra/aws
      - name: Commit only formatting changes on the task branch
        run: |
          if git diff --quiet; then
            echo "Formatting is already clean."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src tests app.py evaluation ops infra/aws
          git commit -m "style: format Python and Terraform sources"
          git push origin "HEAD:${GITHUB_REF_NAME}"
