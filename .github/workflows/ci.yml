name: quality

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# CI is read-only: formatting must be fixed in the PR, never pushed back to main.
permissions:
  contents: read

jobs:
  python-quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-ci.txt
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements-ci.txt
      - name: Verify formatting (do not rewrite files in CI)
        run: python -m black --check src tests app.py
      - run: python -m flake8 src tests app.py --max-line-length=120
      - run: python -m pytest -q
      - run: python -m compileall -q src app.py
      - name: Scan for common credential shapes
        run: |
          ! grep -RInE --exclude-dir=.git --exclude-dir=mediqueryvenv310 --exclude='*.ipynb' \
            '(AIza[0-9A-Za-z_-]{20,}|sk-[A-Za-z0-9_-]{20,}|-----BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY-----)' .

  docker-smoke:
    runs-on: ubuntu-latest
    needs: python-quality
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Build production API image
        run: docker build --pull -t mediquery-api:ci .
      - name: Validate Compose configuration
        env:
          DATABASE_URL: postgresql://mediquery:ci@db:5432/mediquery
          JWT_SECRET: ci-only-secret-that-is-long-enough-for-validation
          CORS_ORIGINS: https://app.example.test
        run: |
          printf '%s\n' \
            'DATABASE_URL=postgresql://mediquery:ci@db:5432/mediquery' \
            'JWT_SECRET=ci-only-secret-that-is-long-enough-for-validation' \
            'CORS_ORIGINS=https://app.example.test' > .env
          docker compose config --quiet
