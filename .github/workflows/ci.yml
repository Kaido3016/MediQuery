name: quality

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# CI is read-only: formatting must be fixed in the PR, never pushed back to main.
permissions:
  contents: read

jobs:
  python-quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-ci.txt
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements-ci.txt
      - name: Verify fresh database migration
        run: DATABASE_URL=sqlite:///./migration-ci.db alembic upgrade head
      - name: Verify formatting (do not rewrite files in CI)
        run: python -m black --check src tests app.py evaluation ops
      - run: python -m flake8 src tests app.py evaluation ops --max-line-length=120
      - run: python -m pytest -q
      - run: python -m compileall -q src app.py evaluation ops
      - name: Scan for common credential shapes
        run: |
          ! grep -RInE --exclude-dir=.git --exclude-dir=mediqueryvenv310 --exclude='*.ipynb' \
            '(AIza[0-9A-Za-z_-]{20,}|sk-[A-Za-z0-9_-]{20,}|-----BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY-----)' .

  docker-smoke:
    runs-on: ubuntu-latest
    needs: python-quality
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Build production API image
        run: docker build --pull -t mediquery-api:ci .
      - name: Validate Compose configuration
        env:
          DATABASE_URL: postgresql://mediquery:ci@db:5432/mediquery
          JWT_SECRET: ci-only-secret-that-is-long-enough-for-validation
          CORS_ORIGINS: https://app.example.test
          RATE_LIMIT_REDIS_URL: redis://redis.example.test:6379/0
          OBJECT_STORAGE_BUCKET: mediquery-ci-reports
          OBJECT_STORAGE_KMS_KEY_ID: arn:aws:kms:ca-central-1:123456789012:key/00000000-0000-0000-0000-000000000000
          SMTP_HOST: smtp.example.test
          SMTP_FROM_EMAIL: noreply@example.test
          FRONTEND_BASE_URL: https://app.example.test
          STRIPE_SECRET_KEY: sk_test_placeholder
          STRIPE_WEBHOOK_SECRET: whsec_placeholder
          STRIPE_PRICE_ID: price_placeholder
          STRIPE_SUCCESS_URL: https://app.example.test/billing/success
          STRIPE_CANCEL_URL: https://app.example.test/billing/cancel
          STRIPE_PORTAL_RETURN_URL: https://app.example.test/billing
          METRICS_TOKEN: ci-only-metrics-secret-that-is-long-enough
          FORWARDED_ALLOW_IPS: 127.0.0.1
        run: |
          printf '%s\n' \
            'DATABASE_URL=postgresql://mediquery:ci@db:5432/mediquery' \
            'JWT_SECRET=ci-only-secret-that-is-long-enough-for-validation' \
            'CORS_ORIGINS=https://app.example.test' \
            'RATE_LIMIT_REDIS_URL=redis://redis.example.test:6379/0' \
            'OBJECT_STORAGE_BUCKET=mediquery-ci-reports' \
            'OBJECT_STORAGE_KMS_KEY_ID=arn:aws:kms:ca-central-1:123456789012:key/00000000-0000-0000-0000-000000000000' \
            'SMTP_HOST=smtp.example.test' \
            'SMTP_FROM_EMAIL=noreply@example.test' \
            'FRONTEND_BASE_URL=https://app.example.test' \
            'STRIPE_SECRET_KEY=sk_test_placeholder' \
            'STRIPE_WEBHOOK_SECRET=whsec_placeholder' \
            'STRIPE_PRICE_ID=price_placeholder' \
            'STRIPE_SUCCESS_URL=https://app.example.test/billing/success' \
            'STRIPE_CANCEL_URL=https://app.example.test/billing/cancel' \
            'METRICS_TOKEN=ci-only-metrics-secret-that-is-long-enough' \
            'FORWARDED_ALLOW_IPS=127.0.0.1' > .env
          docker compose config --quiet

  terraform-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.9.8"
      - name: Check Terraform formatting
        run: terraform fmt -check -recursive infra/aws
      - name: Validate AWS infrastructure module
        working-directory: infra/aws
        run: |
          terraform init -backend=false
          terraform validate
