name: phase22-ai-evaluation

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ai-evaluation-acceptance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements-ci.txt
      - name: Phase 22 integrity gate
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path("docs/PHASE22_AI_EVALUATION.md")
          assert path.is_file() and path.stat().st_size > 0
          text = path.read_text(encoding="utf-8").lower()
          for marker in ("phase 22", "synthetic benchmark", "precision", "recall", "provenance", "prompt injection"):
              assert marker in text, marker
          PY
      - name: Phase 22 acceptance tests
        run: python -m pytest -q tests/test_phase21_25_program.py -k phase22
      - name: Compile evaluation contract
        run: python -m compileall -q src/services/evaluation.py
