name: phase24-trust-security-compliance

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  trust-security-compliance-acceptance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements-ci.txt
      - name: Phase 24 integrity gate
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path("docs/PHASE24_TRUST_SECURITY_COMPLIANCE.md")
          assert path.is_file() and path.stat().st_size > 0
          text = path.read_text(encoding="utf-8").lower()
          for marker in ("phase 24", "threat model", "privacy", "clinical review", "ip", "not a certification"):
              assert marker in text, marker
          PY
      - name: Phase 24 acceptance tests
        run: python -m pytest -q tests/test_phase21_25_program.py -k phase24
      - name: Compile compliance contract
        run: python -m compileall -q src/core/compliance.py
