name: one-time-python-formatting-helper

on:
  push:
    branches:
      - fix/security-data-lifecycle-quality-gates

permissions:
  contents: write

concurrency:
  group: temporary-python-formatting-helper
  cancel-in-progress: true

jobs:
  format-on-task-branch:
    if: github.ref == 'refs/heads/fix/security-data-lifecycle-quality-gates'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -r requirements-ci.txt
      - run: python -m black src tests app.py evaluation ops
      - name: Commit formatting only on the task branch
        run: |
          if git diff --quiet; then
            echo "Python formatting is already clean."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src tests app.py evaluation ops
          git commit -m "style: format report storage adapter changes"
          git push origin "HEAD:${GITHUB_REF_NAME}"
