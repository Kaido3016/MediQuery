name: phase19-production-readiness

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  production-readiness-acceptance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements-ci.txt
      - name: Phase 19 integrity gate
        run: |
          python - <<'PY'
          from pathlib import Path

          required = [
              Path("docs/PHASE19_PRODUCTION_READINESS.md"),
              Path("tests/test_phase19_production_readiness.py"),
              Path("src/core/settings.py"),
              Path("DEPLOYMENT.md"),
              Path(".gitignore"),
          ]
          for path in required:
              assert path.is_file() and path.stat().st_size > 0, path

          document = Path("docs/PHASE19_PRODUCTION_READINESS.md").read_text(encoding="utf-8").lower()
          for marker in (
              "phase 19",
              "production readiness",
              "acceptance criteria",
              "phi",
              "tls/waf",
              "backups",
              "malware scanning",
          ):
              assert marker in document, marker
          print("Phase 19 integrity gate: PASS")
          PY
      - name: Production readiness tests
        run: python -m pytest -q tests/test_phase19_production_readiness.py
      - name: Compile production boundary
        run: python -m compileall -q src/core/settings.py
