name: phase20-commercial-handoff

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  commercial-handoff-acceptance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements-ci.txt
      - name: Phase 20 integrity gate
        run: |
          python - <<'PY'
          from pathlib import Path

          required = [
              Path("docs/PHASE20_COMMERCIAL_HANDOFF.md"),
              Path("RELEASE_CHECKLIST.md"),
              Path("tests/test_phase20_commercial_handoff.py"),
              Path("ACQUISITION.md"),
              Path("BUYER_DUE_DILIGENCE.md"),
              Path("README.md"),
              Path("SECURITY.md"),
              Path("DEPLOYMENT.md"),
              Path("docs/DEMONSTRABLE_DIFFERENTIATION.md"),
              Path("docs/PHASE18_MEDICAL_AI_SAFETY.md"),
              Path("docs/PHASE19_PRODUCTION_READINESS.md"),
          ]
          for path in required:
              assert path.is_file() and path.stat().st_size > 0, path

          document = Path("docs/PHASE20_COMMERCIAL_HANDOFF.md").read_text(encoding="utf-8").lower()
          for marker in (
              "phase 20",
              "commercial handoff",
              "acceptance criteria",
              "buyer handoff package",
              "external diligence",
              "synthetic reports only",
              "does not claim",
          ):
              assert marker in document, marker
          print("Phase 20 integrity gate: PASS")
          PY
      - name: Commercial handoff acceptance tests
        run: python -m pytest -q tests/test_phase20_commercial_handoff.py
      - name: Compile application
        run: python -m compileall -q src app.py
