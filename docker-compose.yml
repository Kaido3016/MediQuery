# Local production-shaped smoke environment. Supply secrets via an untracked .env file.
services:
  api:
    build: .
    env_file: .env
    environment:
      ENVIRONMENT: production
      DATABASE_URL: ${DATABASE_URL:?Set a managed PostgreSQL DATABASE_URL in .env}
      JWT_SECRET: ${JWT_SECRET:?Set a unique JWT_SECRET in .env}
      CORS_ORIGINS: ${CORS_ORIGINS:?Set HTTPS frontend origin(s) in .env}
      RATE_LIMIT_REDIS_URL: ${RATE_LIMIT_REDIS_URL:?Set a private Redis URL in .env}
      FORWARDED_ALLOW_IPS: ${FORWARDED_ALLOW_IPS:-127.0.0.1}
      UPLOAD_ROOT: /data/uploads
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - mediquery_uploads:/data/uploads
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp

volumes:
  mediquery_uploads:
